<!-- Webflow Custom Code: ticket card vertical (Configurable Test Sandbox) -->
<script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
:root {
  /* Configurable CSS Variables for Webflow testing */
  --it-line-width-1: 24px;
  --it-line-width-2: 34px;
  --it-line-width-3: 26px;

  --it-gradient-start: #2563EB;
  --it-gradient-mid: #00F0FF;
  --it-gradient-end: #2563EB;

  --it-speed-multiplier: 3200;
}

/* Prevent Webflow HtmlEmbed wrapper div from rendering a solid black mask shape */
.w-embed.it-network-paths,
.it-network-paths {
  background: transparent !important;
  background-color: transparent !important;
  fill: none !important;
  mask-image: none !important;
  -webkit-mask-image: none !important;
}

.it-network-paths svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
}

/* Target Webflow SVG <use> elements directly */
.it-network-paths use {
  fill: none !important;
  stroke: url(#itSignalGradient) !important;
  stroke-linecap: round;
  will-change: stroke-dashoffset;
}

.it-network-paths use[href*="itSignalPath1"],
.it-network-paths use[*|href*="itSignalPath1"] {
  stroke-width: var(--it-line-width-1) !important;
  stroke-dasharray: 20 50 120 50 20 50 300 50 20 50 150 50 20 99999;
}
.it-network-paths use[href*="itSignalPath2"],
.it-network-paths use[*|href*="itSignalPath2"] {
  stroke-width: var(--it-line-width-2) !important;
  stroke-dasharray: 34 60 120 60 34 60 300 60 34 60 150 60 34 99999;
}
.it-network-paths use[href*="itSignalPath3"],
.it-network-paths use[*|href*="itSignalPath3"] {
  stroke-width: var(--it-line-width-3) !important;
  stroke-dasharray: 25 40 120 40 25 40 250 40 25 40 150 40 25 99999;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Dynamic gradient injection to sync CSS variables with SVG linearGradient
  (function(){
    var svg = document.querySelector(".it-network-paths svg, svg.it-network-paths");
    if (!svg) return;
    
    var defs = svg.querySelector("defs");
    if (!defs) {
      defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      svg.insertBefore(defs, svg.firstChild);
    }
    
    var grad = defs.querySelector("#itSignalGradient");
    if (!grad) {
      grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
      grad.setAttribute("id", "itSignalGradient");
      grad.setAttribute("gradientUnits", "objectBoundingBox");
      grad.setAttribute("x1", "0");
      grad.setAttribute("y1", "0");
      grad.setAttribute("x2", "0.2");
      grad.setAttribute("y2", "1");
      defs.appendChild(grad);
    }
    
    var cs = getComputedStyle(document.documentElement);
    var cStart = cs.getPropertyValue('--it-gradient-start').trim() || '#2563EB';
    var cMid = cs.getPropertyValue('--it-gradient-mid').trim() || '#00F0FF';
    var cEnd = cs.getPropertyValue('--it-gradient-end').trim() || '#2563EB';
    
    grad.innerHTML = 
      '<stop offset="0%" stop-color="' + cStart + '" stop-opacity="0.2"></stop>' +
      '<stop offset="25%" stop-color="' + cStart + '" stop-opacity="0.85"></stop>' +
      '<stop offset="50%" stop-color="' + cMid + '" stop-opacity="1"></stop>' +
      '<stop offset="75%" stop-color="' + cEnd + '" stop-opacity="0.85"></stop>' +
      '<stop offset="100%" stop-color="' + cEnd + '" stop-opacity="0.2"></stop>';
  })();

  // 1. SVG Signal Path Scroll Animation (Dash-Offset Movement)
  (function(){
    var container = document.querySelector(".it-flow-cards");
    var svgPaths = document.querySelector(".it-network-paths");
    if (!container || !svgPaths) return;
    var ticking = false;

    function updatePathOffset() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(function() {
          var rect = container.getBoundingClientRect();
          var vh = window.innerHeight;
          var progress = (vh - rect.top) / (vh + rect.height);
          progress = Math.max(0, Math.min(1, progress));
          
          var speedMult = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--it-speed-multiplier')) || 3200;
          var dashOffset = -(speedMult * progress);
          
          var uses = svgPaths.querySelectorAll("use");
          uses.forEach(function(u) {
            u.style.strokeDashoffset = dashOffset + "px";
          });
          ticking = false;
        });
      }
    }

    window.addEventListener("scroll", updatePathOffset, { passive: true });
    updatePathOffset();
  })();

  // 2. Ticket Track Feed Scroll Animation (Card Motion)
  (function(){
    var stacks = document.querySelectorAll("[data-it-feed]");
    if (!stacks.length) return;
    var ticking = false;

    function updateFeed() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(function() {
          var vh = window.innerHeight;
          stacks.forEach(function(stack) {
            var track = stack.querySelector(".it-ticket-track");
            if (!track) return;
            var rect = stack.getBoundingClientRect();
            var progress = (vh - rect.top) / (vh + rect.height);
            progress = Math.max(0, Math.min(1, progress));
            var translateY = track.scrollHeight * 0.35 * progress;
            track.style.transform = "translateY(" + (-translateY) + "px)";
          });
          ticking = false;
        });
      }
    }

    window.addEventListener("scroll", updateFeed, { passive: true });
    updateFeed();
  })();
});
</script>
