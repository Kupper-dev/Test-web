<!-- Webflow Custom Code: ticket card vertical (Volumetric Energy Flow Upgrade) -->
<script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
  /* -------------------------------------------------------------
     CONFIGURABLE TEST VARIABLES
     ------------------------------------------------------------- */
  :root {
    --it-track-color: rgba(37, 99, 235, 0.18);
    --it-track-width-1: 24px;
    --it-track-width-2: 32px;
    --it-track-width-3: 26px;

    --it-speed-multiplier: 3200;
  }

  .w-embed.it-network-paths,
  .it-network-paths {
    background: transparent !important;
    background-color: transparent !important;
    fill: none !important;
    mask-image: none !important;
    -webkit-mask-image: none !important;
  }

  .it-network-paths svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
  }

  .it-network-paths use {
    fill: none !important;
    stroke-linecap: round !important;
  }

  /* 1. Track Casing (Self-drawing background path - KEPT EXACTLY AS AUTHORIZED) */
  .it-network-paths use.it-track-bg,
  .it-network-paths use.track-line {
    fill: none !important;
    stroke: var(--it-track-color) !important;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .it-network-paths use.it-track-bg-1, .it-network-paths use.track-path-1 { stroke-width: var(--it-track-width-1) !important; }
  .it-network-paths use.it-track-bg-2, .it-network-paths use.track-path-2 { stroke-width: var(--it-track-width-2) !important; }
  .it-network-paths use.it-track-bg-3, .it-network-paths use.track-path-3 { stroke-width: var(--it-track-width-3) !important; }

  /* 2. Soft Luminescent Energy Aura Layer */
  .it-network-paths use.flow-glow-line {
    fill: none !important;
    stroke: url(#itSignalGradient) !important;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.85;
    filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 24px rgba(37, 99, 235, 0.4));
    will-change: stroke-dashoffset;
  }

  /* 3. Core Vibrant Energy Wave */
  .it-network-paths use.it-core-line,
  .it-network-paths use.core-line {
    display: block !important;
    fill: none !important;
    stroke: url(#itSignalGradient) !important;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 1 !important;
    will-change: stroke-dashoffset;
  }
  .it-network-paths use.it-core-line-1, .it-network-paths use.core-path-1 {
    stroke-width: 10px !important;
    stroke-dasharray: 40 80 160 80 40 80 320 80 40 80 180 80 40 99999 !important;
  }
  .it-network-paths use.it-core-line-2, .it-network-paths use.core-path-2 {
    stroke-width: 12px !important;
    stroke-dasharray: 50 90 180 90 50 90 360 90 50 90 200 90 50 99999 !important;
  }
  .it-network-paths use.it-core-line-3, .it-network-paths use.core-path-3 {
    stroke-width: 10px !important;
    stroke-dasharray: 44 70 160 70 44 70 300 70 44 70 180 70 44 99999 !important;
  }

  /* 4. High-Speed Luminous Energy Packet Highlights */
  .it-network-paths use.flow-packet-line {
    fill: none !important;
    stroke: #ffffff !important;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.95;
    filter: drop-shadow(0 0 6px #00f0ff) drop-shadow(0 0 14px #ffffff);
    will-change: stroke-dashoffset;
  }
</style>

<script>
  (function initItFlowCode() {
    function runScripts() {
      var svg = document.querySelector(".it-network-paths svg, svg.it-network-paths");
      if (svg) {
        // Automatically inject track casing and flow layer <use> elements if not present
        var origUses = Array.from(svg.querySelectorAll("use:not(.it-track-bg):not(.flow-glow-line):not(.flow-packet-line)"));
        if (origUses.length >= 3 && !svg.querySelector("use.it-track-bg")) {
          origUses.slice(0, 3).forEach(function(origUse, idx) {
            var trackBg = origUse.cloneNode(true);
            trackBg.removeAttribute("style");
            trackBg.className.baseVal = "it-track-bg it-track-bg-" + (idx + 1);
            
            var glowLine = origUse.cloneNode(true);
            glowLine.className.baseVal = "flow-glow-line flow-glow-path-" + (idx + 1);

            var packetLine = origUse.cloneNode(true);
            packetLine.className.baseVal = "flow-packet-line flow-packet-path-" + (idx + 1);

            origUse.className.baseVal = "it-core-line it-core-line-" + (idx + 1);

            // Layer ordering: Track BG -> Glow Aura -> Core Line -> Packet Highlight
            svg.insertBefore(trackBg, origUse);
            svg.insertBefore(glowLine, origUse);
            svg.appendChild(packetLine);
          });
        }

        // Gradient setup with luminous energy stops
        var defs = svg.querySelector("defs");
        if (!defs) {
          defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
          svg.insertBefore(defs, svg.firstChild);
        }
        var grad = defs.querySelector("#itSignalGradient");
        if (!grad) {
          grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
          grad.setAttribute("id", "itSignalGradient");
          grad.setAttribute("gradientUnits", "objectBoundingBox");
          grad.setAttribute("x1", "0");
          grad.setAttribute("y1", "0");
          grad.setAttribute("x2", "0.3");
          grad.setAttribute("y2", "1");
          defs.appendChild(grad);
        }

        grad.innerHTML =
          '<stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"></stop>' +
          '<stop offset="20%" stop-color="#2563EB" stop-opacity="0.9"></stop>' +
          '<stop offset="45%" stop-color="#00F0FF" stop-opacity="1"></stop>' +
          '<stop offset="55%" stop-color="#FFFFFF" stop-opacity="1"></stop>' +
          '<stop offset="70%" stop-color="#00F0FF" stop-opacity="0.95"></stop>' +
          '<stop offset="85%" stop-color="#2563EB" stop-opacity="0.9"></stop>' +
          '<stop offset="100%" stop-color="#2563EB" stop-opacity="0.25"></stop>';
      }

      // Continuous Volumetric Flow Animation
      var container = document.querySelector(".it-flow-cards");
      var svgPaths = document.querySelector(".it-network-paths");
      if (container && svgPaths) {
        var startTime = performance.now();

        function animateFlow() {
          var rect = container.getBoundingClientRect();
          var vh = window.innerHeight;
          var progress = (vh - rect.top) / (vh + rect.height);
          progress = Math.max(0, Math.min(1, progress));

          var now = performance.now();
          var elapsed = (now - startTime) * 0.001;

          var speedMult = 3200;
          var scrollOffset = -(speedMult * progress);
          var ambientPulse = -(elapsed * 220);

          var movingLines = svgPaths.querySelectorAll("use.it-core-line, use.core-line");
          movingLines.forEach(function (u) {
            u.style.strokeDashoffset = (scrollOffset + ambientPulse) + "px";
          });

          var glowLines = svgPaths.querySelectorAll("use.flow-glow-line");
          glowLines.forEach(function (u) {
            u.style.strokeDashoffset = (scrollOffset + ambientPulse * 0.9) + "px";
          });

          var packetLines = svgPaths.querySelectorAll("use.flow-packet-line");
          packetLines.forEach(function (u) {
            u.style.strokeDashoffset = (scrollOffset * 1.5 + ambientPulse * 2.8) + "px";
          });

          requestAnimationFrame(animateFlow);
        }

        requestAnimationFrame(animateFlow);
      }

      // 3. Ticket Track Feed Scroll Animation
      var stacks = document.querySelectorAll("[data-it-feed]");
      if (stacks.length) {
        var tickingFeed = false;
        function updateFeed() {
          if (!tickingFeed) {
            tickingFeed = true;
            requestAnimationFrame(function () {
              var vh = window.innerHeight;
              stacks.forEach(function (stack) {
                var track = stack.querySelector(".it-ticket-track");
                if (!track) return;
                var rect = stack.getBoundingClientRect();
                var progress = (vh - rect.top) / (vh + rect.height);
                progress = Math.max(0, Math.min(1, progress));
                var translateY = track.scrollHeight * 0.35 * progress;
                track.style.transform = "translateY(" + (-translateY) + "px)";
              });
              tickingFeed = false;
            });
          }
        }
        window.addEventListener("scroll", updateFeed, { passive: true });
        updateFeed();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runScripts);
    } else {
      runScripts();
    }
  })();
</script>
