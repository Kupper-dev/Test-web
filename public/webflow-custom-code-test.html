<!-- Webflow Custom Code: ticket card vertical (Configurable Test Sandbox with WebGL 3D Tube Reveal) -->
<script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  /* -------------------------------------------------------------
     CONFIGURABLE TEST VARIABLES
     ------------------------------------------------------------- */
  :root {
    /* Full Outer Background Track (Continuous casing path) */
    --it-track-color: rgba(37, 99, 235, 0.18);
    --it-track-width-1: 24px;
    --it-track-width-2: 32px;
    --it-track-width-3: 26px;

    /* Inner Moving Animated Signal Line */
    --it-line-width-1: 14px;
    --it-line-width-2: 12px;
    --it-line-width-3: 16px;

    /* Animated Blue Gradient Colors for moving signal bursts */
    --it-color-start: #2563EB;
    --it-color-mid: #00F0FF;
    --it-color-end: #2563EB;

    --it-speed-multiplier: 3200;
  }

  /* Prevent Webflow HtmlEmbed wrapper div from rendering a solid black mask shape */
  .w-embed.it-network-paths,
  .it-network-paths {
    background: transparent !important;
    background-color: transparent !important;
    fill: none !important;
    mask-image: none !important;
    -webkit-mask-image: none !important;
  }

  .it-network-paths svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
  }

  .it-network-paths use {
    fill: none !important;
    stroke-linecap: round !important;
  }

  /* 1. Full continuous outer background tracks (Rendered BEHIND moving core lines) */
  .it-network-paths use.it-track-bg {
    stroke: var(--it-track-color) !important;
    stroke-dasharray: none !important; /* Continuous solid track casing */
    stroke-dashoffset: 0 !important;
    opacity: 1 !important;
  }

  .it-network-paths use.it-track-bg.it-track-bg-1 {
    stroke-width: var(--it-track-width-1) !important;
  }
  .it-network-paths use.it-track-bg.it-track-bg-2 {
    stroke-width: var(--it-track-width-2) !important;
  }
  .it-network-paths use.it-track-bg.it-track-bg-3 {
    stroke-width: var(--it-track-width-3) !important;
  }

  /* 2. Inner core lines hidden visually for WebGL 3D tube experiment */
  .it-network-paths use.it-core-line {
    display: none !important;
  }
</style>

<script>
  (function initItFlowCode() {
    function runScripts() {
      var container = document.querySelector(".it-flow-cards");
      var svg = document.querySelector(".it-network-paths svg, svg.it-network-paths");
      var tubeItems = [];
      var renderer, scene, camera;

      if (container && svg && window.THREE) {
        // Build WebGL Canvas
        var canvas = document.createElement("canvas");
        canvas.id = "it-webgl-canvas-embed";
        canvas.style.position = "absolute";
        canvas.style.top = "0";
        canvas.style.left = "0";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.pointerEvents = "none";
        canvas.style.zIndex = "2";

        if (getComputedStyle(container).position === "static") {
          container.style.position = "relative";
        }
        container.appendChild(canvas);

        scene = new THREE.Scene();
        renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        var ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        var keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(300, 500, 600);
        scene.add(keyLight);
        var rimLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
        rimLight.position.set(-300, -300, 400);
        scene.add(rimLight);

        var vbW = 740, vbH = 2000;
        if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
          vbW = svg.viewBox.baseVal.width;
          vbH = svg.viewBox.baseVal.height;
        }

        camera = new THREE.PerspectiveCamera(45, 1, 1, 10000);

        function resizeRenderer() {
          var rect = container.getBoundingClientRect();
          var w = rect.width || 740;
          var h = rect.height || 2000;
          renderer.setSize(w, h);
          camera.aspect = w / h;
          var depth = (vbH / 2) / Math.tan((45 * Math.PI / 180) / 2);
          camera.position.set(0, 0, depth);
          camera.lookAt(0, 0, 0);
          camera.updateProjectionMatrix();
          renderer.render(scene, camera);
        }

        var pathEls = svg.querySelectorAll("defs path, path");
        var colors = ["#2563eb", "#00f0ff", "#2563eb"];

        Array.from(pathEls).slice(0, 3).forEach(function (pathEl, idx) {
          var totalLen = pathEl.getTotalLength();
          if (!totalLen) return;

          var curvePoints = [];
          var samples = 200;
          for (var i = 0; i <= samples; i++) {
            var pt = pathEl.getPointAtLength((i / samples) * totalLen);
            curvePoints.push(new THREE.Vector3(pt.x - vbW / 2, vbH / 2 - pt.y, 0));
          }

          var curve = new THREE.CatmullRomCurve3(curvePoints, false, "centripetal");
          var radius = 8 - idx * 1.5;
          var tubularSegments = 300;
          var radialSegments = 16;

          var tubeGeometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
          tubeGeometry.setDrawRange(0, 0);

          var mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(colors[idx % colors.length]),
            roughness: 0.15,
            metalness: 0.2,
            emissive: new THREE.Color(colors[idx % colors.length]),
            emissiveIntensity: 0.15
          });

          var tubeMesh = new THREE.Mesh(tubeGeometry, mat);
          scene.add(tubeMesh);

          var sphereGeom = new THREE.SphereGeometry(radius, 16, 16);
          var startCap = new THREE.Mesh(sphereGeom, mat);
          startCap.position.copy(curve.getPoint(0));
          startCap.visible = false;
          scene.add(startCap);

          var tipCap = new THREE.Mesh(sphereGeom, mat);
          tipCap.position.copy(curve.getPoint(0));
          tipCap.visible = false;
          scene.add(tipCap);

          tubeItems.push({
            curve: curve,
            tubeGeometry: tubeGeometry,
            startCap: startCap,
            tipCap: tipCap,
            tubularSegments: tubularSegments,
            radialSegments: radialSegments
          });
        });

        window.addEventListener("resize", resizeRenderer);
        resizeRenderer();
      }

      // 2. SVG Signal Path Scroll Animation (Updates 3D WebGL Tube Reveal)
      if (container) {
        var tickingPaths = false;
        function updatePathOffset() {
          if (!tickingPaths) {
            tickingPaths = true;
            requestAnimationFrame(function () {
              var rect = container.getBoundingClientRect();
              var vh = window.innerHeight;
              var progress = (vh - rect.top) / (vh + rect.height);
              progress = Math.max(0, Math.min(1, progress));

              tubeItems.forEach(function (tItem) {
                if (progress <= 0.001) {
                  tItem.tubeGeometry.setDrawRange(0, 0);
                  tItem.startCap.visible = false;
                  tItem.tipCap.visible = false;
                } else {
                  var ringCount = Math.floor(progress * tItem.tubularSegments);
                  var drawCount = ringCount * tItem.radialSegments * 6;
                  tItem.tubeGeometry.setDrawRange(0, drawCount);
                  tItem.startCap.visible = true;
                  tItem.tipCap.visible = true;
                  tItem.tipCap.position.copy(tItem.curve.getPoint(Math.min(1, progress)));
                }
              });

              if (renderer && scene && camera) {
                renderer.render(scene, camera);
              }
              tickingPaths = false;
            });
          }
        }
        window.addEventListener("scroll", updatePathOffset, { passive: true });
        updatePathOffset();
      }

      // 3. Ticket Track Feed Scroll Animation
      var stacks = document.querySelectorAll("[data-it-feed]");
      if (stacks.length) {
        var tickingFeed = false;
        function updateFeed() {
          if (!tickingFeed) {
            tickingFeed = true;
            requestAnimationFrame(function () {
              var vh = window.innerHeight;
              stacks.forEach(function (stack) {
                var track = stack.querySelector(".it-ticket-track");
                if (!track) return;
                var rect = stack.getBoundingClientRect();
                var progress = (vh - rect.top) / (vh + rect.height);
                progress = Math.max(0, Math.min(1, progress));
                var translateY = track.scrollHeight * 0.35 * progress;
                track.style.transform = "translateY(" + (-translateY) + "px)";
              });
              tickingFeed = false;
            });
          }
        }
        window.addEventListener("scroll", updateFeed, { passive: true });
        updateFeed();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runScripts);
    } else {
      runScripts();
    }
  })();
</script>
